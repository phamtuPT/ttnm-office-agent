# docker compose up --build                     → http://localhost:3000
# docker compose up -d db                        → chỉ PostgreSQL, để chạy backend bằng tay trên máy
# docker compose --profile ollama up --build    → thêm Ollama chạy trên máy (đặt OLLAMA_BASE_URL=http://ollama:11434/v1)
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      SANDBOX_URL: http://sandbox:9000
      DATABASE_URL: postgresql://office:${POSTGRES_PASSWORD}@db:5432/office_agent
    volumes:
      - storage:/data
    networks: [default, sandboxnet]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: office_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # chỉ trên máy này: để chạy backend bằng tay / xem dữ liệu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80" # chỉ mở trên máy này, không lộ ra mạng LAN
    depends_on:
      - backend
    restart: unless-stopped

  # Chạy mã phân tích dữ liệu do AI sinh ra (tool run_python). Không có đường ra Internet:
  # chỉ nối vào mạng nội bộ sandboxnet với backend. Hệ thống tệp chỉ đọc, giới hạn tài nguyên.
  sandbox:
    build: ./sandbox
    networks: [sandboxnet]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

networks:
  sandboxnet:
    internal: true # không có gateway ra ngoài

volumes:
  storage:
  pgdata:
  ollama:
