# Migration CSDL (file nay doc bang ma hoa he thong nen chi dung ASCII). Chay trong thu muc backend:
#   alembic revision --autogenerate -m "mo ta"   -> tao migration tu thay doi model trong app/db.py
#   alembic upgrade head                          -> backend cung tu chay lenh nay khi khoi dong
# Dia chi CSDL lay tu DATABASE_URL (backend/.env), khong ghi o day. Xem docs/DATABASE.md.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
